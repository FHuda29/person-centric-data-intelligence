name: pcdi

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-pcdi}:${POSTGRES_PASSWORD:-pcdi-db-pass}@postgres:5432/${POSTGRES_DB:-pcdi}
  REDIS_URL: redis://redis:6379
  OPENSEARCH_URL: http://opensearch:9200
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-pcdi-neo4j-pass}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pcdi}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pcdi-minio-secret}
  MINIO_BUCKET: pcdi-evidence
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#12345}
  ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
  ANALYST_PASSWORD: ${ANALYST_PASSWORD:-Analyst#12345}
  DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-ID}
  AUTO_MERGE_DETERMINISTIC: ${AUTO_MERGE_DETERMINISTIC:-false}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  NUMVERIFY_API_KEY: ${NUMVERIFY_API_KEY:-}
  NUMVERIFY_BASE_URL: ${NUMVERIFY_BASE_URL:-http://apilayer.net/api/validate}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  SEARXNG_URL: http://searxng:8080
  NEWS_REGION: ${NEWS_REGION:-id-ID}
  MASTODON_INSTANCE: ${MASTODON_INSTANCE:-mastodon.social}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
  BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
  BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
  SANDBASE_API_KEY: ${SANDBASE_API_KEY:-}
  REDDITAPIS_TOKEN: ${REDDITAPIS_TOKEN:-}
  HTTP_USER_AGENT: ${HTTP_USER_AGENT:-PCDI-OSINT-Platform/1.0 (+case-based research; respects robots.txt)}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcdi-db-pass}
      POSTGRES_DB: ${POSTGRES_DB:-pcdi}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcdi} -d ${POSTGRES_DB:-pcdi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-pcdi-neo4j-pass}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4jdata:/data]
    ports: ["127.0.0.1:7474:7474"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pcdi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pcdi-minio-secret}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  # Self-hosted metasearch for the web / social search-index / news connectors. Internal network only.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes: [./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: pcdi/api:1.0.0
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      opensearch: { condition: service_started }
      neo4j: { condition: service_started }
      searxng: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      retries: 30
    networks:
      default:
        aliases: [pcdi-api]   # nginx upstream (see infra/docker/nginx.conf)
    restart: unless-stopped

  worker:
    image: pcdi/api:1.0.0
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  console:
    build: { context: ., dockerfile: apps/intelligence-console/Dockerfile }
    image: pcdi/console:1.0.0
    ports: ["${CONSOLE_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
  neo4jdata:
  miniodata:
